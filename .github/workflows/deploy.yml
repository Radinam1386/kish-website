name: SSH Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 2m
          debug: true

          script: |
            echo "================================"
            echo "SSH CONNECTION SUCCESS"
            echo "================================"

            echo "User:"
            whoami

            echo "Hostname:"
            hostname

            echo "Date:"
            date

            echo "Working directory:"
            pwd
