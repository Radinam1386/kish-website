- name: Deploy via SSH
  uses: appleboy/ssh-action@v1.0.3
  with:
    host: ${{ secrets.SERVER_HOST }}
    username: ${{ secrets.SERVER_USER }}
    key: ${{ secrets.SERVER_SSH_KEY }}
    port: 22

    timeout: 60s
    command_timeout: 30m
    debug: true

    script: |
      set -e

      echo "=============================================="
      echo "SSH AUTHENTICATED SUCCESSFULLY"
      echo "=============================================="

      whoami
      hostname
      pwd
