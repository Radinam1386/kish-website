name: Deploy to Server

on:
  push:
    branches: [main]

concurrency:
  group: kish-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |
            set -e

            # فقط root اجازه Deploy دارد
            test "$(id -u)" -eq 0

            # بررسی وجود flock
            command -v flock >/dev/null

            # جلوگیری از Deploy همزمان
            flock -n /run/lock/kish-deploy.lock bash -c '
              set -e

              echo "======================================"
              echo "      KISH WEBSITE DEPLOY START"
              echo "======================================"

              cd /var/www/kish-website

              # بررسی مالکیت پروژه
              test "$(stat -c %U .)" = root

              # بررسی تغییرات دستی روی سرور
              git diff --quiet
              git diff --cached --quiet

              echo "Pulling latest code..."
              git pull --ff-only origin main

              echo "======================================"
              echo "        BUILD FRONTEND"
              echo "======================================"

              cd /var/www/kish-website/frontend

              npm ci
              npm run build

              echo "Frontend build completed."

              echo "======================================"
              echo "        BACKEND CHECK"
              echo "======================================"

              cd /var/www/kish-website/backend

              source venv/bin/activate

              python manage.py check

              echo "Django check completed."

              echo "======================================"
              echo "        RESTART BACKEND"
              echo "======================================"

              systemctl restart kish

              echo "Backend restarted."

              echo "======================================"
              echo "        RELOAD NGINX"
              echo "======================================"

              nginx -t
              systemctl reload nginx

              echo "Nginx reloaded."

              echo "======================================"
              echo "       KISH DEPLOY SUCCESS"
              echo "======================================"
            '